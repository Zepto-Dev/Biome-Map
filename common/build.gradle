plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}

// The mod's code, shared by both loaders. It compiles against plain Minecraft, so it can't use NeoForge or
// Fabric classes by accident: those go through Platform.
legacyForge {
    mcpVersion = minecraft_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}

// Minecraft 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// forge/ and fabric/ compile these sources and resources into their own jars.
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
