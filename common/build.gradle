plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// The mod's code, shared by both loaders. It compiles against plain Minecraft, so it can't use NeoForge or
// Fabric classes by accident: those go through Platform.
neoForge {
    neoFormVersion = neo_form_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// neoforge/ and fabric/ compile these sources and resources into their own jars.
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
