# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parameter names and javadoc for Minecraft code (development only, does not affect the built jars)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]

# Forge. The jar is built against this version and works with any 47.x, which includes NeoForge for 1.20.1.
forge_version=47.4.28
forge_version_range=[47,)
loader_version_range=[47,)

# Fabric. The jar works with any Fabric Loader from fabric_loader_min and needs Fabric API.
fabric_loader_version=0.19.5
fabric_loader_min=0.14.21
fabric_api_version=0.92.12+1.20.1

## Mod Properties
mod_id=biomemap
mod_name=Biome Map
mod_license=MIT
mod_version=1.1.1
mod_group_id=io.github.zeptodev.biomemap
mod_authors=Zepto-Dev
mod_source_url=https://github.com/Zepto-Dev/Biome-Map
