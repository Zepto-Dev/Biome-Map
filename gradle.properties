# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parameter names and javadoc for Minecraft code (development only, does not affect the built jars)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Minecraft
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
# Plain Minecraft for the shared code in common/
neo_form_version=1.21.11-20251209.172050

# NeoForge. Matches the version this mod was written for; any later 21.11.x also works.
neo_version=21.11.48
loader_version_range=[1,)

# Fabric. The jar works with any Fabric Loader from fabric_loader_min and needs Fabric API.
fabric_loader_version=0.19.5
fabric_loader_min=0.17.3
fabric_api_version=0.141.6+1.21.11

## Mod Properties
mod_id=biomemap
mod_name=Biome Map
mod_license=MIT
mod_version=1.1.1
mod_group_id=io.github.zeptodev.biomemap
mod_authors=Zepto-Dev
mod_source_url=https://github.com/Zepto-Dev/Biome-Map
